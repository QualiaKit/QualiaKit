name: Developer experience

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  public-consumers:
    name: Public examples (${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            xcode: '15.2'
          - runner: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify docs, links, snippets and original GIF
        run: python3 Tools/DeveloperExperience/verify.py
      - name: Build package
        run: swift build
      - name: Verify developer contracts
        run: swift test --filter DeveloperExperienceTests
      - name: Test external public consumer and exact LivingStory commands
        run: swift test --package-path Examples/DeveloperExperience
      - name: Run public diagnostic walkthrough
        run: swift run --package-path Examples/DeveloperExperience qualia-walkthrough
      - name: Build example app
        if: matrix.xcode == '26.6'
        run: >-
          xcodebuild build -project Examples/QualiaExample/QualiaExample.xcodeproj
          -scheme QualiaExample -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Compile and audit all public DocC products
        if: matrix.xcode == '26.6'
        run: python3 Tools/DeveloperExperience/build_docs.py --output "$RUNNER_TEMP/qualia-docs"
      - name: Package DocC archives without changing symbol filenames
        if: matrix.xcode == '26.6'
        # DocC uses colons in symbol routes; artifact uploads reject those filenames.
        run: tar -czf "$RUNNER_TEMP/qualia-developer-documentation.tar.gz" -C "$RUNNER_TEMP/qualia-docs" .
      - name: Save DocC archives and coverage audit
        if: matrix.xcode == '26.6'
        uses: actions/upload-artifact@v4
        with:
          name: qualia-developer-documentation
          path: ${{ runner.temp }}/qualia-developer-documentation.tar.gz
          if-no-files-found: error
