name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: swift build -c release

      - name: Build QualiaKit with strict concurrency
        run: |
          swift build \
            --target QualiaKit \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme Qualia \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/QualiaKitPackageTests.xctest/Contents/MacOS/QualiaKitPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format="lcov" > coverage.lcov || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  model-contract:
    name: Model contract evidence
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.0"

      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show pinned toolchain
        run: |
          python3 --version
          swift --version
          xcodebuild -version
          xcrun coremlcompiler version

      - name: Run asset-free schema and comparator tests
        run: |
          python3 Tools/ModelContract/reference_inference.py --schema-self-test
          python3 Tools/ModelContract/reference_inference.py --comparator-self-test

      - name: Run asset-free Swift contract tests
        run: swift test --filter CurrentModelContractTests

      - name: Verify checksum-bound protected-run evidence
        run: python3 Tools/ModelContract/reference_inference.py --verify-committed-evidence

  matrix-build:
    name: Build on ${{ matrix.platform }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - platform: "iOS Simulator"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.2"
            scheme: Qualia
          - platform: "iOS Simulator (QualiaBert)"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.2"
            scheme: QualiaBert
          - platform: "iOS Simulator (QualiaKit)"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.2"
            scheme: QualiaKit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build ${{ matrix.scheme }} on ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
