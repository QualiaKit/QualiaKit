name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify test fixtures
        run: |
          python3 Tests/CoreMLFixtures/verify.py
          python3 Tests/TestingFixtures/generate.py
          python3 Tests/ModelContract/reference_inference.py --schema-self-test
          python3 Tests/ModelContract/reference_inference.py --comparator-self-test
          python3 -m unittest discover -s Tests/ModelContract -p 'test_*.py'
      - name: Build library products with strict concurrency
        run: |
          swift build -c release
          for target in QualiaKit QualiaTesting QualiaCoreML; do
            swift build --target "$target" -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          done
      - name: Test library and example model
        run: swift test --enable-code-coverage
      - name: Test public consumers and compatibility package
        run: |
          swift test --package-path Tests/Consumer
          swift test --package-path Packages/QualiaCoreML
      - name: Build library products for iOS
        run: |
          for scheme in QualiaKit QualiaCoreML Qualia QualiaBert; do
            xcodebuild build -scheme "$scheme" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          done
      - name: Build minimal example
        run: >-
          xcodebuild build -project Examples/QualiaExample/QualiaExample.xcodeproj
          -scheme QualiaExample -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
