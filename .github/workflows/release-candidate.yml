name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Frozen source commit (full SHA)
        required: true
        type: string
      evidence_ref:
        description: Reviewed evidence branch commit (full SHA)
        required: true
        type: string
      version:
        description: Unprefixed SemVer (for example 0.1.0-beta.1)
        required: true
        type: string
  push:
    tags: ['v0.*', 'v[1-9]*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      source: ${{ steps.identity.outputs.source }}
      evidence: ${{ steps.identity.outputs.evidence }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_ref || 'release-evidence' }}
          path: evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify evidence and exact candidate identity before expensive builds
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
          REQUESTED_EVIDENCE: ${{ inputs.evidence_ref }}
        run: python3 source/Tools/Release/workflow_gate.py source evidence
  public-checks:
    needs: evidence
    uses: ./.github/workflows/release-checks.yml
    with:
      source_ref: ${{ needs.evidence.outputs.source }}
  bundle:
    needs: [evidence, public-checks]
    runs-on: macos-26
    timeout-minutes: 10
    # Configure an owner reviewer in GitHub; the job never creates a tag/release.
    environment: qualia-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.evidence.outputs.source }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.evidence.outputs.evidence }}
          path: evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble reviewed evidence atomically
        env:
          RELEASE_VERSION: ${{ needs.evidence.outputs.version }}
        run: source/scripts/release-check --candidate "$GITHUB_WORKSPACE/evidence/$RELEASE_VERSION/candidate.json" --bundle "$RUNNER_TEMP/bundle"
      - name: Preserve exact bundle filenames
        run: tar -czf "$RUNNER_TEMP/qualia-release.tar.gz" -C "$RUNNER_TEMP/bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: qualia-release-${{ needs.evidence.outputs.version }}
          path: ${{ runner.temp }}/qualia-release.tar.gz
          if-no-files-found: error
